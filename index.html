<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strikers King Creator - Yapan Kişi: Mehmet Helvacı</title>
    <link rel="icon" type="image/x-icon" href="app/app.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta http-equiv="refresh" content="0; url=app/">
    <script>
        // Sayfa parametrelerini ve hash'i koruyarak uygulamayı anında aç
        try {
            var target = 'app/' + window.location.search + window.location.hash;
            window.location.replace(target);
        } catch(e) {
            window.location.href = 'app/';
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(255, 215, 0, 0.08) 0%, transparent 60%);
        }
        .portal-card {
            background: rgba(16, 24, 40, 0.95);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 240, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00f0ff, #ffd700, #ff0055);
        }
        .logo-wrap {
            margin-bottom: 20px;
            display: inline-block;
            position: relative;
        }
        .portal-logo {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
        }
        .app-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .app-title span {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }
        .app-desc {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .author-box {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(0, 240, 255, 0.1));
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 28px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        }
        .author-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #00f0ff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .author-name {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .primary-action {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            color: #050b14;
            box-shadow: 0 6px 20px rgba(0, 240, 255, 0.4);
        }
        .primary-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.6);
        }
        .secondary-action {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #e2e8f0;
        }
        .secondary-action:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.35);
        }
        .redirect-notice {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-top-color: #00f0ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="logo-wrap">
            <img src="app/app.png" alt="Strikers King Creator" class="portal-logo">
        </div>
        <h1 class="app-title">Strikers King <span>Creator</span></h1>
        <p class="app-desc">Kick Canlı Yayın & Espor Takım Seçme, Turnuva Ağacı ve Oyuncu İstatistik Platformu</p>

        <div class="author-box">
            <div class="author-label"><i class="fa-solid fa-code"></i> Proje Mimarı & Geliştirici</div>
            <div class="author-name">
                <i class="fa-solid fa-crown" style="color: #ffd700;"></i> Yapan Kişi: Mehmet Helvacı
            </div>
        </div>

        <div class="btn-group">
            <a href="app/" class="action-btn primary-action">
                <i class="fa-solid fa-play"></i> <span>Uygulamaya Giriş Yap</span>
            </a>
            <a href="app/?overlay=1" class="action-btn secondary-action">
                <i class="fa-solid fa-display"></i> <span>OBS Canlı Yayın Overlay Modu</span>
            </a>
            <a href="https://github.com/mehmet7helvaci/TAKIM-SE-ME-UYGULAMASI-Strikers-King-Creator" target="_blank" class="action-btn secondary-action">
                <i class="fa-brands fa-github"></i> <span>GitHub Kaynak Kodu</span>
            </a>
        </div>

        <div class="redirect-notice">
            <div class="spinner"></div>
            <span>Uygulama otomatik olarak yükleniyor...</span>
        </div>
    </div>
</body>
</html>
